<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tra Tự Điển Nôm</title>
    <!-- Font Awesome & Google Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <!-- Header với chữ neon chớp -->
        <header>
            <h1 class="neon-text">Tự Điển Nôm</h1>
        </header>

        <!-- Khung tìm kiếm -->
        <div class="search-wrapper">
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Nhập từ vd (bát,tuệ,ngộ,v...v...)" autocomplete="off" />
                <button id="searchBtn"><i class="fas fa-search"></i> Tìm</button>
            </div>
        </div>

        <!-- Khung hiển thị kết quả -->
        <div id="resultArea" class="result-area">
            <p class="hint">🔍 Nhập từ và nhấn Tìm để tra cứu</p>
        </div>

        <!-- Footer thông tin -->
        <footer>
            <span>Thiết Kế Trần Cường - Zalo 0907860662</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
